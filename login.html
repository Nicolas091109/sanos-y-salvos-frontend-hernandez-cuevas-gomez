<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanos y Salvos — Login</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        * {
            minargin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #07090f;
            color: #f0f0f5;
        }

        /* ==================== CONTENEDOR PRINCIPAL ==================== */
        .scene {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }

        /* SVG de fondo */
        .scene svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay gradiente */
        .scene::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                rgba(8, 10, 18, 0.75), 
                rgba(13, 15, 28, 0.6), 
                rgba(8, 10, 18, 0.8));
            z-index: 2;
            pointer-events: none;
        }

        /* ==================== BADGES FLOTANTES ==================== */
        .badges-container {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }

        .badge {
            position: absolute;
            background: rgba(13, 15, 24, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .badge-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .badge-icon.lost {
            background: #f87171;
            box-shadow: 0 0 12px rgba(248, 113, 113, 0.5);
        }

        .badge-icon.found {
            background: #34d399;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.5);
        }

        .badge:nth-child(1) {
            top: 60px;
            left: 40px;
            animation-delay: 0s;
        }

        .badge:nth-child(2) {
            bottom: 80px;
            left: 50px;
            animation-delay: 1s;
        }

        .badge:nth-child(3) {
            top: 100px;
            right: 60px;
            background: rgba(13, 15, 24, 0.8);
            border: 1px solid rgba(124, 92, 252, 0.2);
            animation-delay: 0.5s;
        }

        .badge-number {
            font-family: 'DM Serif Display', serif;
            font-size: 18px;
            color: #a78bfa;
            font-weight: bold;
        }

        .badge-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .badge-title {
            color: #f0f0f5;
            font-weight: 500;
        }

        .badge-subtitle {
            color: #5a5f78;
            font-size: 12px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* ==================== CARD FORMULARIO ==================== */
        .card {
            position: relative;
            z-index: 10;
            width: 360px;
            background: rgba(13, 15, 20, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            padding: 36px;
            backdrop-filter: blur(24px);
            box-shadow: 
                0 32px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Header con branding */
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            minargin-bottom: 24px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: #7c5cfc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(124, 92, 252, 0.35);
        }

        .card-brand {
            font-family: 'DM Serif Display', serif;
            font-size: 19px;
            color: #f0f0f5;
            font-weight: bold;
        }

        /* Título */
        .card-title {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            minargin-bottom: 8px;
            line-height: 1.2;
        }

        .card-title em {
            font-style: italic;
            color: #a78bfa;
        }

        /* Subtítulo */
        .card-subtitle {
            font-size: 13px;
            color: #9ba0bb;
            minargin-bottom: 24px;
        }

        /* ==================== TABS ==================== */
        .tabs {
            display: flex;
            background: rgba(28, 32, 48, 0.7);
            border-radius: 10px;
            padding: 3px;
            minargin-bottom: 24px;
            gap: 3px;
        }

        .tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: #9ba0bb;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab.active {
            background: #7c5cfc;
            color: #fff;
            box-shadow: 0 0 20px rgba(124, 92, 252, 0.35);
        }

        .tab:hover:not(.active) {
            color: #d4d6e0;
        }

        /* ==================== PANES DE CONTENIDO ==================== */
        .tab-panes {
            position: relative;
            height: 280px;
        }

        .pane {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pane.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ==================== FORM GROUPS ==================== */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9ba0bb;
            font-weight: 600;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-label-link {
            color: #a78bfa;
            text-decoration: none;
            cursor: pointer;
            font-size: 10px;
            transition: opacity 0.2s;
        }

        .form-label-link:hover {
            opacity: 0.8;
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #5a5f78;
            pointer-events: none;
            font-size: 16px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            padding: 12px 12px 12px 38px;
            color: #f0f0f5;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: #5a5f78;
        }

        .form-input:focus {
            outline: none;
            border-color: #7c5cfc;
            background: rgba(124, 92, 252, 0.08);
            box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.15);
        }

        /* ==================== BOTONES ==================== */
        .btn-primary {
            width: 100%;
            padding: 12px 16px;
            background: #7c5cfc;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(124, 92, 252, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.85;
            transform: translateY(-1px);
            box-shadow: 0 12px 32px rgba(124, 92, 252, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* ==================== DIVIDER ==================== */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            minargin: 12px 0;
            font-size: 12px;
            color: #5a5f78;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        /* ==================== BOTONES SOCIALES ==================== */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-social {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #f0f0f5;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* ==================== DEMO HINT ==================== */
        .demo-hint {
            background: rgba(124, 92, 252, 0.08);
            border: 1px solid rgba(124, 92, 252, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 11px;
            color: #9ba0bb;
            text-align: center;
            line-height: 1.4;
        }

        .demo-hint strong {
            color: #a78bfa;
            font-weight: 600;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .scene {
                min-height: 100vh;
            }

            .card {
                width: 100%;
                minax-width: 360px;
                minargin: 0 20px;
            }

            .badge {
                font-size: 12px;
                padding: 10px 12px;
            }

            .badge:nth-child(1) {
                top: 30px;
                left: 20px;
            }

            .badge:nth-child(2) {
                bottom: 60px;
                left: 20px;
            }

            .badge:nth-child(3) {
                top: 30px;
                right: 20px;
            }
        }

        /* ==================== ANIMACIONES ==================== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>

                    </div>

                    <div class="demo-hint" style="margin-bottom: 8px;">
                        User Demo: <strong>demo@test.com</strong> · <strong>1234</strong>
                    </div>
                    <div class="demo-hint">
                        Admin: <strong>admin@sanos.com</strong> · <strong>admin123</strong>
                    </div>
                </div>

                <!-- Pane: Register -->
                <div class="pane" id="tab-register">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Nombre</label>
                            <div class="form-input-wrapper">
                                <span class="form-input-icon">></span>
                                <input type="text" class="form-input" placeholder="Juan" id="register-firstName">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Apellido</label>
                            <div class="form-input-wrapper">
                                <span class="form-input-icon">></span>
                                <input type="text" class="form-input" placeholder="Pérez" id="register-lastName">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="form-input-wrapper">
                            <span class="form-input-icon">@</span>
                            <input type="email" class="form-input" placeholder="tu@email.com" id="register-email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <div class="form-input-wrapper">
                            <span class="form-input-icon">*</span>
                            <input type="password" class="form-input" placeholder="••••••••" id="register-password">
                        </div>
                    </div>

                    <button class="btn-primary" onclick="handleRegister()">
                        Crear mini cuenta
                    </button>

                    <div class="divider">o usa</div>

                    <div class="social-buttons">
                        <button class="btn-social">
                            Google
                        </button>
                        <button class="btn-social">
                            GitHub
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // ==================== FUNCIONES DE TABS ====================
        function switchTab(tabName, element) {
            // Remover clase active de todas las tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Remover clase active de todos los panes
            document.querySelectorAll('.pane').forEach(pane => {
                pane.classList.remove('active');
            });

            // Agregar clase active a la tab clickeada
            element.classList.add('active');

            // Agregar clase active al pane correspondiente
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // ==================== FUNCIONES DE AUTENTICACIÓN ====================
        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert('Por favor completa todos los campos');
                return;
            }

            // Validar contra base de datos minock
            const users = [
                { email: 'demo@test.com', password: '1234', name: 'Demo User', role: 'user' },
                { email: 'admin@sanos.com', password: 'admin123', name: 'Administrador', role: 'admin' }
            ];

            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                // Guardar en localStorage
                localStorage.setItem('syss_user', JSON.stringify({
                    email: user.email,
                    name: user.name,
                    role: user.role
                }));

                alert(`¡Bienvenido, ${user.name}!`);
                
                // Redirigir según rol
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    console.log('Login exitoso:', user);
                }
            } else {
                alert('Email o contraseña incorrectos');
            }
        }

        function handleRegister() {
            const firstName = document.getElementById('register-firstName').value.trim();
            const lastName = document.getElementById('register-lastName').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;

            if (!firstName || !lastName || !email || !password) {
                alert('Por favor completa todos los campos');
                return;
            }

            // Validar email
            if (!email.includes('@')) {
                alert('Ingresa un email válido');
                return;
            }

            // Validar longitud de contraseña
            if (password.length < 4) {
                alert('La contraseña debe tener al minenos 4 caracteres');
                return;
            }

            // Guardar nuevo usuario en localStorage (para demo)
            const fullName = `${firstName} ${lastName}`;
            localStorage.setItem('syss_user', JSON.stringify({
                email: email,
                name: fullName
            }));

            alert(`¡Cuenta creada exitosamente, ${fullName}!`);
            console.log('Registro exitoso:', { fullName, email });
        }

        // ==================== INICIALIZACIÓN ====================
        window.addEventListener('load', () => {
            // Verificar si hay sesión guardada
            const savedUser = localStorage.getItem('syss_user');
            if (savedUser) {
                console.log('Usuario autenticado:', JSON.parse(savedUser));
            }
        });

        // ==================== EVENT LISTENERS ====================
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                // Si estamos en login, enviar login
                if (document.getElementById('tab-login').classList.contains('active')) {
                    handleLogin();
                }
                // Si estamos en register, enviar register
                else if (document.getElementById('tab-register').classList.contains('active')) {
                    handleRegister();
                }
            }
        });
    </script>
</body>
</html>
